[package]
name = "flins"
version = "0.1.0"
description = "Flins — Native Private Journal & Notes with AI Librarian"
authors = ["dreamyr"]
edition = "2024"

[lib]
name = "flins_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
# Нативні системні діалоги (Finder на Mac, File Explorer на Windows)
rfd = "0.15"
# Кросплатформенні папки даних (AppData на Windows, Application Support на Mac)
dirs-next = "2.0"
tauri-plugin-process = "2"

# ЗАХИСТ: компілюється виключно на macOS!
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.27.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
